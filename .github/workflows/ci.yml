name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: local/${{ github.event.repository.name }}:ci

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify dependency metadata
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run prek quality hooks
        run: uv run prek run --all-files

      - name: Reset coverage data
        run: uv run coverage erase

      - name: Unit tests
        run: >-
          uv run pytest tests/unit
          --cov=app
          --cov-branch
          --cov-report=
          --cov-fail-under=0

      - name: Integration tests
        run: >-
          uv run pytest tests/integration
          --cov=app
          --cov-branch
          --cov-append
          --cov-report=
          --cov-fail-under=0

      - name: Enforce branch coverage
        run: |
          uv run coverage report --show-missing --fail-under=80
          uv run coverage xml

      - name: Export runtime dependency graph
        run: >-
          uv export
          --no-dev
          --format requirements-txt
          --output-file "${RUNNER_TEMP}/requirements-runtime.txt"

      - name: Audit runtime dependencies
        run: >-
          uv run pip-audit
          --requirement "${RUNNER_TEMP}/requirements-runtime.txt"
          --progress-spinner off

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  docker:
    name: Docker build and smoke test
    needs: [quality-and-tests, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build runnable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test operational endpoints
        shell: bash
        run: |
          set -Eeuo pipefail

          service_port="$(awk '/^EXPOSE / { print $2; exit }' Dockerfile)"
          test -n "${service_port}"

          container_name="${GITHUB_REPOSITORY##*/}-smoke-${GITHUB_RUN_ID}"
          headers_file="$(mktemp)"
          live_body="$(mktemp)"
          ready_body="$(mktemp)"

          cleanup() {
            exit_code=$?
            if [ "${exit_code}" -ne 0 ]; then
              docker logs "${container_name}" || true
            fi
            docker stop "${container_name}" >/dev/null 2>&1 || true
            exit "${exit_code}"
          }
          trap cleanup EXIT

          docker run --detach --rm \
            --name "${container_name}" \
            --publish "127.0.0.1:18080:${service_port}" \
            "${IMAGE_NAME}"

          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/health/live >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            --dump-header "${headers_file}" \
            --output "${live_body}" \
            http://127.0.0.1:18080/health/live
          grep --ignore-case --quiet '^x-request-id:' "${headers_file}"
          grep --quiet '"status":"ok"' "${live_body}"

          curl --fail --silent --show-error \
            --output "${ready_body}" \
            http://127.0.0.1:18080/health/ready
          grep --quiet '"status":"ready"' "${ready_body}"
